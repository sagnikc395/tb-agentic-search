    "fonttools>=4.68.0",
    "gradio>=5.0,<6.0",
    "groq>=1.7.0",
    "langchain-openai>=0.3",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.3",
    "tooluniverse",
]
