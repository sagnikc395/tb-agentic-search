[project]
name = "tb-agentic-search"
version = "0.1.0"
description = "Detect TB-related research documents with a biomni agent on Groq"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "biomni>=0.0.8",
    "groq>=1.7.0",
    "langchain-openai>=0.3",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.3",
    "tooluniverse",
]

[project.scripts]
tb-search = "tb_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tb_search"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]
