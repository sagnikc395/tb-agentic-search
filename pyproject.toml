[project]
name = "tb-agentic-search"
version = "0.1.0"
description = "TB literature screening and VCF resistance prediction with a biomni agent on a locally served LLM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "biomni>=0.0.8",
    "langchain-ollama>=0.3",
    "langchain-openai>=0.3",
    "pandas>=3.1.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tooluniverse",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
